  <rect width="760" height="260" fill="#f8f7fc"/>
  <g fill="#ffffff" stroke="#e4e1f0">
    <rect x="20" y="40" width="170" height="44" rx="10"/><rect x="20" y="108" width="170" height="44" rx="10"/><rect x="20" y="176" width="170" height="44" rx="10"/>
  </g>
  <g fill="#1e1b2e" text-anchor="middle"><text x="105" y="67">Laravel / PHP</text><text x="105" y="135">Node.js / Python</text><text x="105" y="203">Mobile app (presigned)</text></g>
