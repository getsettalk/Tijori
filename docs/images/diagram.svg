<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="system-ui, sans-serif" font-size="14" role="img" aria-label="Apps talk to Tijori over the S3 API; Tijori stores plain files on disk and copies them to backups">
