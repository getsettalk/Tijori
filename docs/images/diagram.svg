      <stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#625e78"/></marker>
