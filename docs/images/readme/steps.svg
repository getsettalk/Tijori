<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 240" width="1280" height="240" role="img" aria-label="Three steps: install, set up with tijori init, run with tijori serve">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#9333EA"/></linearGradient></defs>
<rect width="1280" height="240" rx="24" fill="#F8F7FC"/>
<g transform="translate(20 20)">
<rect width="400" height="200" rx="20" fill="#FFFFFF" stroke="#E4E1F0" stroke-width="2"/>
<circle cx="52" cy="54" r="26" fill="url(#bg)"/><text x="52" y="64" text-anchor="middle" font-size="28" font-weight="800" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">1</text>
<text x="94" y="64" font-size="26" font-weight="700" fill="#1E1B2E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Install</text>
<rect x="26" y="102" width="348" height="46" rx="10" fill="#1E1B2E"/>
<text x="42" y="132" font-size="17" fill="#FCD34D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$ <tspan fill="#FFFFFF">curl -fsSL …/install.sh | sh</tspan></text>
<text x="28" y="180" font-size="16" fill="#625E78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">or: docker run ghcr.io/getsettalk/tijori</text>
</g><path d="M424 120 h12" stroke="#9333EA" stroke-width="3" stroke-linecap="round"/><path d="M434 113 l7 7 -7 7" fill="none" stroke="#9333EA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(440 20)">
<rect width="400" height="200" rx="20" fill="#FFFFFF" stroke="#E4E1F0" stroke-width="2"/>
<circle cx="52" cy="54" r="26" fill="url(#bg)"/><text x="52" y="64" text-anchor="middle" font-size="28" font-weight="800" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">2</text>
<text x="94" y="64" font-size="26" font-weight="700" fill="#1E1B2E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Set up</text>
<rect x="26" y="102" width="348" height="46" rx="10" fill="#1E1B2E"/>
<text x="42" y="132" font-size="17" fill="#FCD34D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$ <tspan fill="#FFFFFF">tijori init</tspan></text>
<text x="28" y="180" font-size="16" fill="#625E78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">admin password + first access key</text>
</g><path d="M844 120 h12" stroke="#9333EA" stroke-width="3" stroke-linecap="round"/><path d="M854 113 l7 7 -7 7" fill="none" stroke="#9333EA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(860 20)">
<rect width="400" height="200" rx="20" fill="#FFFFFF" stroke="#E4E1F0" stroke-width="2"/>
<circle cx="52" cy="54" r="26" fill="url(#bg)"/><text x="52" y="64" text-anchor="middle" font-size="28" font-weight="800" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">3</text>
<text x="94" y="64" font-size="26" font-weight="700" fill="#1E1B2E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Run &amp; connect</text>
<rect x="26" y="102" width="348" height="46" rx="10" fill="#1E1B2E"/>
<text x="42" y="132" font-size="17" fill="#FCD34D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$ <tspan fill="#FFFFFF">tijori serve</tspan></text>
<text x="28" y="180" font-size="16" fill="#625E78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">open localhost:9000/_admin</text>
</g>
</svg>