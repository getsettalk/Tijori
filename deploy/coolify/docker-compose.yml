# documentation: https://getsettalk.github.io/Tijori/coolify/
# slogan: Tiny self-hosted S3-compatible storage with an admin panel.
# category: storage
# tags: s3, object, storage, files, images, backup
# port: 9000
#
# Tijori for Coolify (tested on v4.5.3). In Coolify:
#   + New Resource -> Docker Compose -> paste this file -> Create Service -> Deploy.
# The admin password is under General -> Service configuration.
# Coolify's proxy routes the domain to port 9000. Do not add a `ports:` section.
# Step-by-step guide with screenshots: https://getsettalk.github.io/Tijori/coolify/
services:
  tijori:
    image: ghcr.io/getsettalk/tijori:latest
    # For video thumbnails use: ghcr.io/getsettalk/tijori:latest-ffmpeg
    restart: unless-stopped
    environment:
      # Coolify gives this service a domain and routes it to port 9000.
      - SERVICE_URL_TIJORI_9000
      # Full address with https://, used for share links in the admin panel.
      - TIJORI_PUBLIC_URL=${SERVICE_URL_TIJORI}
      # Admin panel login is "admin"; Coolify generates this password.
      - TIJORI_ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
      # Optional: a ready-made key for your app. Set both, or leave both empty.
      - TIJORI_ACCESS_KEY=${TIJORI_ACCESS_KEY:-}
      - TIJORI_SECRET_KEY=${TIJORI_SECRET_KEY:-}
    volumes:
      - tijori-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/tijori", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  tijori-data:
